<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:20px; }
canvas { border-radius:50%; }
button { background:#f59e0b; color:#000; font-weight:900; padding:12px 24px; border:none; border-radius:8px; cursor:pointer; font-size:1rem; }
</style>
</head>
<body>
<canvas id="c" width="512" height="512"></canvas>
<button onclick="download()">⬇️ Download PNG</button>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const S = 512;

// Background circle — deep gold gradient
const bg = ctx.createRadialGradient(S/2, S/2, 60, S/2, S/2, S/2);
bg.addColorStop(0,   '#3d1a00');
bg.addColorStop(0.5, '#1a0800');
bg.addColorStop(1,   '#0a0400');
ctx.beginPath();
ctx.arc(S/2, S/2, S/2, 0, Math.PI*2);
ctx.fillStyle = bg;
ctx.fill();

// Outer ring
ctx.beginPath();
ctx.arc(S/2, S/2, S/2 - 12, 0, Math.PI*2);
ctx.strokeStyle = '#f59e0b';
ctx.lineWidth = 18;
ctx.stroke();

// Inner ring
ctx.beginPath();
ctx.arc(S/2, S/2, S/2 - 36, 0, Math.PI*2);
ctx.strokeStyle = '#92400e';
ctx.lineWidth = 4;
ctx.stroke();

// House/hood icon in center
const cx = S/2, cy = S/2 - 20;
ctx.save();

// Roof (triangle)
ctx.beginPath();
ctx.moveTo(cx, cy - 110);
ctx.lineTo(cx - 120, cy - 10);
ctx.lineTo(cx + 120, cy - 10);
ctx.closePath();
const roofGrad = ctx.createLinearGradient(cx, cy-110, cx, cy-10);
roofGrad.addColorStop(0, '#fcd34d');
roofGrad.addColorStop(1, '#f59e0b');
ctx.fillStyle = roofGrad;
ctx.fill();
ctx.strokeStyle = '#92400e';
ctx.lineWidth = 3;
ctx.stroke();

// House body
ctx.beginPath();
ctx.rect(cx - 90, cy - 10, 180, 120);
const bodyGrad = ctx.createLinearGradient(cx, cy-10, cx, cy+110);
bodyGrad.addColorStop(0, '#f59e0b');
bodyGrad.addColorStop(1, '#d97706');
ctx.fillStyle = bodyGrad;
ctx.fill();
ctx.strokeStyle = '#92400e';
ctx.lineWidth = 3;
ctx.stroke();

// Door
ctx.beginPath();
ctx.rect(cx - 28, cy + 40, 56, 70);
ctx.fillStyle = '#1a0800';
ctx.fill();
ctx.strokeStyle = '#92400e';
ctx.lineWidth = 2;
ctx.stroke();

// Door knob
ctx.beginPath();
ctx.arc(cx + 18, cy + 76, 5, 0, Math.PI*2);
ctx.fillStyle = '#fcd34d';
ctx.fill();

// Windows
for (let wx of [cx - 68, cx + 32]) {
  ctx.beginPath();
  ctx.rect(wx, cy + 10, 36, 28);
  ctx.fillStyle = '#fcd34d44';
  ctx.fill();
  ctx.strokeStyle = '#fcd34d';
  ctx.lineWidth = 2;
  ctx.stroke();
  // window cross
  ctx.beginPath();
  ctx.moveTo(wx + 18, cy + 10);
  ctx.lineTo(wx + 18, cy + 38);
  ctx.moveTo(wx, cy + 24);
  ctx.lineTo(wx + 36, cy + 24);
  ctx.strokeStyle = '#fcd34d';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

ctx.restore();

// HOOD text
ctx.font = '900 82px Arial Black, Arial';
ctx.fillStyle = '#f59e0b';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.shadowColor = '#f59e0b';
ctx.shadowBlur = 18;
ctx.fillText('HOOD', S/2, S/2 + 160);
ctx.shadowBlur = 0;

// Small subtitle
ctx.font = '700 22px Arial';
ctx.fillStyle = '#92400e';
ctx.letterSpacing = '4px';
ctx.fillText('60628 · BASE NETWORK', S/2, S/2 + 210);

// Shine overlay
const shine = ctx.createRadialGradient(S*0.35, S*0.25, 0, S*0.35, S*0.25, S*0.55);
shine.addColorStop(0, 'rgba(255,255,255,0.08)');
shine.addColorStop(1, 'rgba(255,255,255,0)');
ctx.beginPath();
ctx.arc(S/2, S/2, S/2, 0, Math.PI*2);
ctx.fillStyle = shine;
ctx.fill();

function download() {
  const a = document.createElement('a');
  a.download = 'hood_token_logo.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
}
</script>
</body>
</html>
