<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supervising Electrician — Flash Card System</title>
<style>
:root{--bg:#0b1120;--surface:#131c2e;--surface2:#1a2540;--border:#1e3055;--text:#e2e8f0;--text2:#94a3b8;--accent:#3b82f6;--accent2:#2563eb;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--orange:#f97316;--purple:#a855f7;--cyan:#06b6d4;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.app{max-width:720px;margin:0 auto;padding:16px}

/* ── HEADER ── */
.header{text-align:center;padding:20px 0 10px}
.header h1{font-size:22px;color:#fff;letter-spacing:.5px}
.header p{font-size:13px;color:var(--text2);margin-top:4px}
.streak{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 14px;margin-top:10px;font-size:13px;color:var(--yellow)}
.streak .fire{font-size:16px}

/* ── NAV TABS ── */
.nav{display:flex;gap:4px;margin:16px 0;background:var(--surface);border-radius:var(--radius);padding:4px}
.nav button{flex:1;padding:10px;border:none;border-radius:8px;background:transparent;color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.nav button.active{background:var(--accent);color:#fff}
.nav button:hover:not(.active){background:var(--surface2)}

/* ── VIEWS ── */
.view{display:none}.view.active{display:block}

/* ── DASHBOARD ── */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
.stat-card .num{font-size:28px;font-weight:700}
.stat-card .lbl{font-size:12px;color:var(--text2);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.stat-card.mastered .num{color:var(--green)}
.stat-card.learning .num{color:var(--yellow)}
.stat-card.new .num{color:var(--accent)}
.stat-card.total .num{color:var(--purple)}
.progress-bar{width:100%;height:8px;background:var(--surface2);border-radius:4px;margin-top:12px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .6s ease}

/* ── DECK CARDS ── */
.deck-list{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.deck-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.2s;display:flex;justify-content:space-between;align-items:center}
.deck-item:hover{border-color:var(--accent);transform:translateY(-1px)}
.deck-item .deck-info h3{font-size:15px;color:#fff}
.deck-item .deck-info p{font-size:12px;color:var(--text2);margin-top:2px}
.deck-item .deck-count{font-size:13px;background:var(--surface2);padding:6px 12px;border-radius:8px;color:var(--text2)}
.deck-item .deck-count span{color:var(--green);font-weight:600}

/* ── STUDY VIEW ── */
.study-header{display:flex;justify-content:space-between;align-items:center;margin:12px 0;font-size:13px;color:var(--text2)}
.study-header .badge{background:var(--surface2);padding:4px 10px;border-radius:12px}
.card-container{perspective:1200px;height:340px;margin:0 0 20px;cursor:pointer}
@media(max-width:480px){.card-container{height:400px}}
.flashcard{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.flashcard.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:var(--radius);padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--border);overflow-y:auto}
.card-front{background:var(--surface);box-shadow:var(--shadow)}
.card-back{background:var(--surface2);transform:rotateY(180deg);border:1px solid var(--accent)}
.card-ref{position:absolute;top:12px;left:16px;font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.card-topic{position:absolute;top:12px;right:16px;font-size:11px;color:var(--text2);background:var(--bg);padding:3px 8px;border-radius:10px}
.card-q{font-size:18px;font-weight:600;line-height:1.5;color:#fff}
.card-a{font-size:17px;font-weight:500;line-height:1.6;white-space:pre-line;color:var(--text)}
.card-hint{position:absolute;bottom:12px;font-size:11px;color:var(--text2);font-style:italic}
.difficulty-bar{display:flex;gap:8px;width:100%;margin-bottom:16px}
.diff-btn{flex:1;padding:12px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.diff-btn.again{background:#7f1d1d;color:#fca5a5}.diff-btn.again:hover{background:#991b1b}
.diff-btn.hard{background:#713f12;color:#fde047}.diff-btn.hard:hover{background:#854d0e}
.diff-btn.good{background:#14532d;color:#86efac}.diff-btn.good:hover{background:#166534}
.diff-btn.easy{background:#1e3a5f;color:#93c5fd}.diff-btn.easy:hover{background:#1e40af}
.study-controls{display:flex;gap:10px;width:100%}
.study-controls button{flex:1;padding:14px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.btn-prev{background:var(--surface2);color:var(--text2)}.btn-prev:hover{background:var(--border)}
.btn-shuffle{background:var(--surface);color:var(--text2);border:1px solid var(--border);flex:.6}.btn-shuffle:hover{background:var(--surface2)}
.btn-next{background:var(--accent);color:#fff}.btn-next:hover{background:var(--accent2)}

/* ── QUIZ VIEW ── */
.quiz-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin:16px 0}
.quiz-q{font-size:17px;font-weight:600;line-height:1.5;color:#fff;margin-bottom:20px}
.quiz-opts{display:flex;flex-direction:column;gap:10px}
.quiz-opt{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:.2s;font-size:14px;color:var(--text)}
.quiz-opt:hover{border-color:var(--accent);background:rgba(59,130,246,.08)}
.quiz-opt.correct{border-color:var(--green);background:rgba(34,197,94,.12);color:var(--green)}
.quiz-opt.wrong{border-color:var(--red);background:rgba(239,68,68,.1);color:var(--red)}
.quiz-opt.disabled{pointer-events:none;opacity:.6}
.quiz-result{text-align:center;margin:20px 0}
.quiz-result .score{font-size:48px;font-weight:700;color:var(--green)}
.quiz-result .lbl{font-size:14px;color:var(--text2)}
.quiz-progress{display:flex;gap:4px;margin:16px 0;flex-wrap:wrap}
.quiz-pip{width:8px;height:8px;border-radius:50%;background:var(--surface2)}.quiz-pip.right{background:var(--green)}.quiz-pip.wrong{background:var(--red)}

/* ── BACK BUTTON ── */
.back-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;margin:10px 0;transition:.2s}
.back-btn:hover{border-color:var(--accent);color:var(--text)}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:40px 20px;color:var(--text2)}
.empty .icon{font-size:48px;margin-bottom:12px}

/* ── ANIMATIONS ── */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.view.active{animation:fadeIn .25s ease}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>⚡ Supervising Electrician Exam</h1>
    <p>Flash Card Study System</p>
    <div class="streak"><span class="fire">🔥</span> <span id="streakCount">0</span>-day streak · <span id="totalReviewed">0</span> reviewed</div>
  </div>

  <div class="nav">
    <button class="active" onclick="showView('dashboard')">Dashboard</button>
    <button onclick="showView('decks')">Decks</button>
    <button onclick="showView('study')">Study</button>
    <button onclick="showView('quiz')">Quiz</button>
  </div>

  <div id="v-dashboard" class="view active">
    <div class="stats-grid">
      <div class="stat-card mastered"><div class="num" id="statMastered">0</div><div class="lbl">Mastered</div></div>
      <div class="stat-card learning"><div class="num" id="statLearning">0</div><div class="lbl">Learning</div></div>
      <div class="stat-card new"><div class="num" id="statNew">0</div><div class="lbl">New</div></div>
      <div class="stat-card total"><div class="num" id="statTotal">0</div><div class="lbl">Total</div></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <p style="text-align:center;font-size:12px;color:var(--text2);margin-top:8px" id="progressLabel">0% complete</p>
  </div>

  <div id="v-decks" class="view">
    <div class="deck-list" id="deckList"></div>
  </div>

  <div id="v-study" class="view">
    <div class="study-header">
      <span id="studyProgress">Card 1 of 0</span>
      <span class="badge" id="studyDeck">All Cards</span>
    </div>
    <div class="card-container" onclick="flipCard()">
      <div class="flashcard" id="studyCard">
        <div class="card-face card-front">
          <div class="card-ref" id="studyRef">Q1</div>
          <div class="card-topic" id="studyTopic">Theory</div>
          <div class="card-q" id="studyQ">Loading…</div>
          <div class="card-hint">Tap to reveal answer</div>
        </div>
        <div class="card-face card-back">
          <div class="card-ref">Answer</div>
          <div class="card-a" id="studyA">Loading…</div>
          <div class="card-hint">Tap to view question</div>
        </div>
      </div>
    </div>
    <div class="difficulty-bar" id="diffBar" style="display:none">
      <button class="diff-btn again" onclick="rateCard(0)">Again</button>
      <button class="diff-btn hard" onclick="rateCard(1)">Hard</button>
      <button class="diff-btn good" onclick="rateCard(2)">Good</button>
      <button class="diff-btn easy" onclick="rateCard(3)">Easy</button>
    </div>
    <div class="study-controls">
      <button class="btn-prev" onclick="prevCard()">← Prev</button>
      <button class="btn-shuffle" onclick="shuffleDeck()">🔀 Shuffle</button>
      <button class="btn-next" onclick="nextCard()">Next →</button>
    </div>
  </div>

  <div id="v-quiz" class="view">
    <div class="study-header">
      <span id="quizProgress">Question 1</span>
      <span class="badge" id="quizScore">Score: 0</span>
    </div>
    <div id="quizContent"></div>
  </div>
</div>

<script>
// ── FLASHCARD DATA ──
const DECKS = {
  "Branch Circuits & Receptacles": [
    {id:"23",topic:"Grounded Conductors",q:"For screw shell devices, which terminal and lead color is the grounded conductor?",a:"Terminal: connected to the screw shell\nLead: White or Gray finish",ref:"200.10"},
    {id:"24",topic:"DC Branch Circuits",q:"How must ungrounded conductors (4 AWG+) on DC systems >60V be identified?",a:"By polarity at all termination, connection, and splice points \u2014 using marking tape, tagging, or other approved means.",ref:"210.5(C)(2)"},
    {id:"25",topic:"Voltage Caps",q:"What is the voltage limit for residential luminaires and cord-and-plug loads \u22641440 VA?",a:"120 Volts, nominal",ref:"210.6"},
    {id:"26",topic:"GFCI",q:"What dwelling areas require GFCI protection?",a:"Laundry areas",ref:"210.8(A)(10)"},
    {id:"27",topic:"GFCI",q:"What are the kitchen sink receptacle location rules?",a:"Reference Figure 210.52(C)(1) for measurement start point.",ref:"210.8(A)(6)+(7), 210.52(C)"},
    {id:"28",topic:"GFCI",q:"What are the bathroom sink receptacle distance requirements?",a:"Within 3 feet of the outside edge of each basin.\n\nNot more than 12 inches below the top of the basin/countertop.",ref:"210.52(D)"},
    {id:"29",topic:"Balcony",q:"What are the balcony/deck/porch receptacle requirements?",a:"\u2022 At least 1 receptacle accessible from balcony/deck/porch\n\u2022 Not more than 6\u00bd ft above walking surface\n\u2022 No sq. ft. requirement \u2014 intent is holiday lighting, avoiding extension cords",ref:"210.8(A)(3), 210.52(E)(3)"},
    {id:"30",topic:"Lampholders",q:"What rating is required for lampholders on circuits over 20A?",a:"Must be heavy-duty type:\n\u2022 Not less than 600W (admedium type)\n\u2022 Not less than 750W (any other type)",ref:"210.21(A)"},
    {id:"31",topic:"Spacing",q:"What is the maximum wall spacing for receptacles?",a:"No point measured horizontally along the floor line shall be more than 6 feet from a receptacle outlet.",ref:"210.52(A)(1)"},
    {id:"32",topic:"Garage",q:"What is the garage receptacle requirement for dwellings?",a:"At least one receptacle outlet per vehicle bay.",ref:"210.52(G)(1)"},
    {id:"33",topic:"Closet Lighting",q:"What are the closet lighting requirements per CEC amendment?",a:"Wall switch-controlled lighting mandatory in clothes closets and closets over 25 sq ft.\n\nNO PULL CHAINS \u2014 permanently installed only.",ref:"210.70(A)(2)(5)"},
    {id:"34",topic:"Sink Lighting",q:"When is a switched lighting outlet required above a sink/basin?",a:"When the room or area is greater than 64 square feet.",ref:"210.70(A)(2)(6)"},
    {id:"35",topic:"DC Color",q:"Which DC polarity conductor gets black tape?",a:"Negative polarity",ref:"210.5(C)(1), 215.12(C)(2), 712.25"},
    {id:"73",topic:"Lampholders",q:"What is the temperature limit for lampholders near combustible material?",a:"Combustible material shall not exceed 90\u00b0C (194\u00b0F).",ref:"410.97"}
  ],
  "Calculations": [
    {id:"36",topic:"Loads",q:"How do you calculate loads for ballast/transformer/LED driver circuits?",a:"Based on the total ampere ratings of such units, NOT on the total watts of the lamps.",ref:"220.18(B)"},
    {id:"37",topic:"Range Demand",q:"How do you calculate range service/feeder demand?",a:"1. (kW \u2212 12) \u00d7 5% = percentage increase\n2. Find Column C demand for number of appliances\n3. Multiply by (1 + percentage)\n4. Grounded conductor = result \u00d7 70% (per 220.61)",ref:"Table 220.55"},
    {id:"38",topic:"Feeder Neutrals",q:"What is the 2-phase neutral reduction for 200A service?",a:"70%",ref:"220.61(B)"},
    {id:"39",topic:"Festoon",q:"What are the festoon lighting conductor and messenger requirements?",a:"Minimum: 12 AWG (unless supported by messenger wires)\nMessenger required: All spans exceeding 40 feet",ref:"225.6(B)"}

  "Chapter 9 Tables": [
    {id:"127",topic:"Conduit Bends",q:"What are the bend radii from Chapter 9 Table 2?",a:"One-shot bend radius of 3\" rigid = 13\"\nOther bends radius of 1\u00bd\" rigid = 8\"",ref:"Ch. 9 Table 2"},
    {id:"128",topic:"Conduit Sizing",q:"How do you size EMT for given conductors?",a:"Example: (3) #8 THHW = \u00be\" EMT\nUse Table 4 for conduit dimensions, Table 5 for conductor dimensions.",ref:"Ch. 9 Tables 4 & 5"},
    {id:"129",topic:"Conduit",q:"What does Table 4 provide for EMT?",a:"Nominal Internal Diameter for each trade size.",ref:"Ch. 9 Table 4"}
  ],
  "Chicago Municipal Code": [
    {id:"7",topic:"Permits",q:"When do you need engineered drawings for a sign?",a:"Signs erected entirely above the roof of a building.",ref:"600.27/600.28"},
    {id:"8",topic:"Permits",q:"What is the Chicago Municipal Code supplement package fee?",a:"$1,000",ref:"13-12-040"},
    {id:"9",topic:"Permits",q:"What code covers architecture drawing noncompliance fines?",a:"Fines in accordance with 13-12-060",ref:"13-12-060"},
    {id:"10",topic:"Permits",q:"What is required when an EC applies for a permit?",a:"Permit must be signed by the Supervising Electrician.",ref:"13-12-370"},
    {id:"11",topic:"Enforcement",q:"What is NOT the responsibility of an AHJ?",a:"Enforcing infractions that weren't corrected within 10-15 days.",ref:"13-12-400"},

  "Communications & Coaxial": [
    {id:"115",topic:"Class 2 Circuits",q:"What is a Class 2 circuit?",a:"Wiring between the load side of a Class 2 power source and connected equipment. Provides fire initiation safety and electric shock protection due to power limitations.\n\nPower sources per 725.121(A)(1)-(5):\n1. Listed Class 2 or 3 transformer\n2. Listed Class 2 or 3 power supply\n3. Other listed equipment marked Class 2 or 3\n4. Listed A/V/IT/comms/industrial limited-power circuits\n5. Dry cell battery \u226430V, capacity \u2264 series No. 6 carbon zinc cells",ref:"Article 725"},

    {id:"123",topic:"Coaxial",q:"What are the coaxial cable separation requirements outside buildings?",a:"(E)(1): At least 4 inches from electric light, power, Class 1, or non-power-limited fire alarm conductors\n\n(E)(3): At least 6 feet from lightning conductors where practicable",ref:"820.44(E)"},
    {id:"124",topic:"Coaxial",q:"What are the rules for unlisted coaxial cables entering buildings?",a:"Permitted in non-riser/plenum spaces where:\n\u2022 Length within building \u2264 50 ft from entrance\n\u2022 Enters from outside and terminated at a grounding block",ref:"820.48"},
    {id:"125",topic:"Coaxial",q:"What are the coaxial cable protection and grounding requirements?",a:"820.93(C): Listed primary protector as close as practicable to entrance point.\n\n820.100(A)(3): Bonding/GEC not smaller than #14 AWG, capacity \u2265 outer sheath, \u2264 #6 AWG.\n820.100(A)(4): In 1-2 family dwellings, \u2264 20 ft.\n820.100(A)(5): Run in straight line as practicable.\n820.100(A)(6): Metal raceway both ends bonded to contained conductor.",ref:"820.93 + 820.100"},

// ── SPACED REPETITION ENGINE ──
const STORAGE_KEY = 'elec_flashcard_progress';
const STREAK_KEY = 'elec_flashcard_streak';

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) { return {}; }
}
function saveProgress(p) { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
function loadStreak() {
  try { return JSON.parse(localStorage.getItem(STREAK_KEY)) || {count:0,lastDate:''}; } catch(e) { return {count:0,lastDate:''}; }
}
function saveStreak(s) { localStorage.setItem(STREAK_KEY, JSON.stringify(s)); }

function getAllCards() {
  let all = [];
  for (const [deck, cards] of Object.entries(DECKS)) {
    cards.forEach(c => all.push({...c, deck}));
  }
  return all;
}

function getCardLevel(cardId) {
  const p = loadProgress();
  return p[cardId]?.level ?? -1;
}

function setCardLevel(cardId, level) {
  const p = loadProgress();
  if (!p[cardId]) p[cardId] = {level, reviews:0,lastReviewed:Date.now()};
  p[cardId].level = level;
  p[cardId].reviews = (p[cardId].reviews||0) + 1;
  p[cardId].lastReviewed = Date.now();
  saveProgress(p);
  updateStreak();
  refreshDashboard();
}

function updateStreak() {
  const s = loadStreak();
  const today = new Date().toISOString().slice(0,10);
  if (s.lastDate !== today) {
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);
    s.count = (s.lastDate === yesterday) ? s.count + 1 : 1;
    s.lastDate = today;
    saveStreak(s);
  }
  document.getElementById('streakCount').textContent = s.count;
}

function refreshDashboard() {
  const all = getAllCards();
  const p = loadProgress();
  let mastered=0, learning=0, newCards=0;
  all.forEach(c => {
    const lvl = p[c.id]?.level;
    if (lvl === undefined || lvl === -1) newCards++;
    else if (lvl >= 2) mastered++;
    else learning++;
  });
  document.getElementById('statMastered').textContent = mastered;
  document.getElementById('statLearning').textContent = learning;
  document.getElementById('statNew').textContent = newCards;
  document.getElementById('statTotal').textContent = all.length;
  const pct = Math.round((mastered / all.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = pct + '% complete';
  document.getElementById('totalReviewed').textContent = Object.keys(p).length;
}

// ── VIEWS ──
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('v-' + name).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  if (name === 'dashboard') refreshDashboard();
  if (name === 'decks') renderDecks();
  if (name === 'study') initStudy();
  if (name === 'quiz') initQuiz();
}

// ── DECKS VIEW ──
function renderDecks() {
  const list = document.getElementById('deckList');
  const p = loadProgress();
  list.innerHTML = '';
  const all = getAllCards();
  const allMastered = all.filter(c => (p[c.id]?.level ?? -1) >= 2).length;
  list.innerHTML += `<div class="deck-item" onclick="studyDeck('all')">
    <div class="deck-info"><h3>📚 All Cards</h3><p>Complete exam review</p></div>
    <div class="deck-count"><span>${allMastered}</span> / ${all.length}</div>
  </div>`;
  const dueCards = getDueCards();
  list.innerHTML += `<div class="deck-item" onclick="studyDeck('due')">
    <div class="deck-info"><h3>🔄 Due for Review</h3><p>Spaced repetition</p></div>
    <div class="deck-count">${dueCards.length} cards</div>
  </div>`;
  for (const [deck, cards] of Object.entries(DECKS)) {
    const m = cards.filter(c => (p[c.id]?.level ?? -1) >= 2).length;
    list.innerHTML += `<div class="deck-item" onclick="studyDeck('${deck.replace(/'/g,"\\'")}')">
      <div class="deck-info"><h3>${deckIcon(deck)}</h3><p>${cards.length} cards</p></div>
      <div class="deck-count"><span>${m}</span> / ${cards.length}</div>
    </div>`;
  }
}

// ── DUE CARDS ──
function getDueCards() {
  const p = loadProgress();
  const all = getAllCards();
  const now = Date.now();
  return all.filter(c => {
    const data = p[c.id];
    if (!data) return true;
    const interval = [1,5,15,60][data.level] || 1;
    const nextReview = data.lastReviewed + (interval * 60000);
    return now >= nextReview;
  });
}

// ── STUDY MODE ──
let studyCards = [];
let studyIdx = 0;
let currentDeck = 'all';

function initStudy() {
  studyCards = getAllCards();
  currentDeck = 'all';
  studyIdx = 0;
  renderStudyCard();
}

function studyDeck(deck) {
  showView('study');
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.nav button')[2].classList.add('active');
  currentDeck = deck;
  if (deck === 'all') studyCards = getAllCards();
  else if (deck === 'due') studyCards = getDueCards();
  else studyCards = DECKS[deck] ? [...DECKS[deck]] : getAllCards();
  studyIdx = 0;
  document.getElementById('studyDeck').textContent = deck === 'all' ? 'All Cards' : deck === 'due' ? 'Due Review' : deck;
  renderStudyCard();
}

function renderStudyCard() {
  if (!studyCards.length) {
    document.getElementById('studyQ').textContent = 'No cards in this deck!';
    document.getElementById('studyA').textContent = '';
    return;
  }
  const card = studyCards[studyIdx];
  document.getElementById('studyQ').textContent = card.q;
  document.getElementById('studyA').textContent = card.a;
  document.getElementById('studyRef').textContent = 'Ref: ' + card.id;
  document.getElementById('studyTopic').textContent = card.topic;
  document.getElementById('studyProgress').textContent = `Card ${studyIdx+1} of ${studyCards.length}`;
  document.getElementById('studyCard').classList.remove('flipped');
  document.getElementById('diffBar').style.display = 'none';
}

function flipCard() {
  document.getElementById('studyCard').classList.toggle('flipped');
  if (document.getElementById('studyCard').classList.contains('flipped')) {
    document.getElementById('diffBar').style.display = 'flex';
  } else {
    document.getElementById('diffBar').style.display = 'none';
  }
}

function rateCard(level) {
  const card = studyCards[studyIdx];
  setCardLevel(card.id, level);
  document.getElementById('diffBar').style.display = 'none';
  nextCard();
}

function nextCard() {
  if (!studyCards.length) return;
  studyIdx = (studyIdx + 1) % studyCards.length;
  renderStudyCard();
}

function prevCard() {
  if (!studyCards.length) return;
  studyIdx = (studyIdx - 1 + studyCards.length) % studyCards.length;
  renderStudyCard();
}

function shuffleDeck() {
  for (let i = studyCards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [studyCards[i], studyCards[j]] = [studyCards[j], studyCards[i]];
  }
  studyIdx = 0;
  renderStudyCard();
}

let quizScoreVal = 0;
let quizAnswered = false;

function initQuiz() {
  quizCards = getAllCards().sort(() => Math.random() - 0.5).slice(0, 10);
  quizIdx = 0;
  quizScoreVal = 0;
  quizAnswered = false;
  renderQuizQuestion();
}

function renderQuizQuestion() {
  if (quizIdx >= quizCards.length) {
    renderQuizResult();
    return;
  }
  const card = quizCards[quizIdx];
  const allAnswers = getAllCards().map(c => c.a);
  const wrongAnswers = allAnswers.filter(a => a !== card.a).sort(() => Math.random() - 0.5).slice(0, 3);
  const options = [...wrongAnswers, card.a].sort(() => Math.random() - 0.5);
  
  document.getElementById('quizProgress').textContent = `Question ${quizIdx + 1} of ${quizCards.length}`;
  document.getElementById('quizScore').textContent = `Score: ${quizScoreVal}`;
  
  let html = `<div class="quiz-card">
    <div class="quiz-q">${card.q}</div>
    <div class="quiz-opts" id="quizOpts">`;
  options.forEach((opt, i) => {
    html += `<div class="quiz-opt" onclick="quizAnswer(this,'${btoa(card.a)}','${btoa(opt)}')">${opt.length > 80 ? opt.substring(0,80)+'…' : opt}</div>`;
  });
  html += `</div></div>`;
  html += `<div class="quiz-progress">`;
  quizCards.forEach((_, i) => {
    html += `<div class="quiz-pip" id="pip${i}"></div>`;
  });
  html += `</div>`;
  
  document.getElementById('quizContent').innerHTML = html;
  quizAnswered = false;
}

function quizAnswer(el, correctB64, chosenB64) {
  if (quizAnswered) return;
  quizAnswered = true;
  const correct = atob(correctB64);
  const chosen = atob(chosenB64);
  const opts = document.querySelectorAll('.quiz-opt');
  opts.forEach(o => {
    o.classList.add('disabled');
    const optText = o.textContent.length > 80 ? o.textContent.replace('…','') : o.textContent;
    if (optText === correct || correct.startsWith(optText)) o.classList.add('correct');
    if (optText === chosen && chosen !== correct) o.classList.add('wrong');
  });
  
  const pip = document.getElementById('pip' + quizIdx);
  if (chosen === correct) {
    quizScoreVal++;
    pip.classList.add('right');
  } else {
    pip.classList.add('wrong');
  }
  document.getElementById('quizScore').textContent = `Score: ${quizScoreVal}`;
  
  setTimeout(() => {
    quizIdx++;
    renderQuizQuestion();
  }, 1500);
}

function renderQuizResult() {
  const pct = Math.round((quizScoreVal / quizCards.length) * 100);
  let grade = pct >= 90 ? 'A+' : pct >= 80 ? 'A' : pct >= 70 ? 'B' : pct >= 60 ? 'C' : 'D';
  document.getElementById('quizContent').innerHTML = `
    <div class="quiz-result">
      <div class="score">${quizScoreVal}/${quizCards.length}</div>
      <div class="lbl">${pct}% — Grade: ${grade}</div>
      <div style="margin-top:20px">
        <button class="btn-next" onclick="initQuiz()" style="width:100%">Try Again</button>
      </div>
    </div>`;
}

// ── INIT ──
refreshDashboard();
updateStreak();
</script>
