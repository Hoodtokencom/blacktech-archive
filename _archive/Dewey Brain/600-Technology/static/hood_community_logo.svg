<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e0c00"/>
      <stop offset="100%" stop-color="#060200"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><circle cx="256" cy="256" r="250"/></clipPath>

    <!-- Reusable raised fist symbol -->
    <symbol id="fist" viewBox="0 0 60 80">
      <!-- Wrist/arm -->
      <rect x="18" y="58" width="24" height="22" rx="6" fill="#c27803"/>
      <!-- Palm base -->
      <rect x="10" y="36" width="40" height="28" rx="8" fill="#d97706"/>
      <!-- Fingers curled -->
      <!-- Index finger -->
      <rect x="12" y="16" width="10" height="26" rx="5" fill="#d97706"/>
      <!-- Middle finger -->
      <rect x="24" y="10" width="10" height="30" rx="5" fill="#d97706"/>
      <!-- Ring finger -->
      <rect x="36" y="14" width="10" height="28" rx="5" fill="#d97706"/>
      <!-- Pinky -->
      <rect x="46" y="20" width="8" height="22" rx="4" fill="#c27803"/>
      <!-- Thumb -->
      <rect x="4" y="34" width="12" height="16" rx="6" fill="#c27803"/>
      <!-- Knuckle highlights -->
      <line x1="12" y1="30" x2="22" y2="30" stroke="#92400e" stroke-width="1.5" opacity="0.5"/>
      <line x1="24" y1="28" x2="34" y2="28" stroke="#92400e" stroke-width="1.5" opacity="0.5"/>
      <line x1="36" y1="29" x2="46" y2="29" stroke="#92400e" stroke-width="1.5" opacity="0.5"/>
      <!-- Outline -->
      <path d="M18,80 L18,58 Q10,54 10,44 L10,36 Q8,32 12,28
               L12,16 Q12,10 17,10 Q22,10 22,16 L22,24
               L24,10 Q24,4 29,4 Q34,4 34,10 L34,26
               L36,14 Q36,8 41,8 Q46,8 46,14 L46,34
               L48,20 Q48,15 52,16 Q56,17 54,22 L50,38
               L54,38 Q58,38 58,44 Q58,50 52,52 L42,64 L42,80 Z"
            fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <!-- Background -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Outer gold ring -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="#f59e0b" stroke-width="14"/>
  <circle cx="256" cy="256" r="233" fill="none" stroke="#78350f" stroke-width="2.5"/>

  <!-- Center glow -->
  <circle cx="256" cy="256" r="150" fill="url(#centerGlow)"/>

  <g clip-path="url(#clip)">

  <!-- ═══ BLOCKCHAIN RING — chain links ═══ -->
  <g opacity="0.7">
    <rect x="238" y="54" width="36" height="18" rx="9" fill="none" stroke="#f59e0b" stroke-width="3.5" transform="rotate(0,256,256)"/>
    <rect x="238" y="54" width="36" height="18" rx="9" fill="none" stroke="#f59e0b" stroke-width="3.5" transform="rotate(45,256,256)"/>
    <rect x="238" y="54" width="36" height="18" rx="9" fill="none" stroke="#f59e0b" stroke-width="3.5" transform="rotate(90,256,256)"/>
    <rect x="238" y="54" width="36" height="18" rx="9" fill="none" stroke="#f59e0b" stroke-width="3.5" transform="rotate(135,256,256)"/>
    <rect x="238" y="54" width="36" height="18" rx="9" fill="none" stroke="#f59e0b" stroke-width="3.5" transform="rotate(180,256,256)"/>
    <rect x="238" y="54" width="36" height="18" rx="9" fill="none" stroke="#f59e0b" stroke-width="3.5" transform="rotate(225,256,256)"/>
    <rect x="238" y="54" width="36" height="18" rx="9" fill="none" stroke="#f59e0b" stroke-width="3.5" transform="rotate(270,256,256)"/>
    <rect x="238" y="54" width="36" height="18" rx="9" fill="none" stroke="#f59e0b" stroke-width="3.5" transform="rotate(315,256,256)"/>
  </g>

  <!-- ═══ 6 RAISED FISTS in a circle ═══ -->
  <!-- Each fist placed at radius ~155, rotated so fist points INWARD toward center -->

  <!-- Fist 1 — TOP — points down -->
  <g transform="translate(256,256) rotate(0) translate(-30,-155) scale(0.95)">
    <use href="#fist" width="60" height="80"/>
  </g>

  <!-- Fist 2 — upper right — points lower-left -->
  <g transform="translate(256,256) rotate(60) translate(-30,-155) scale(0.95)">
    <use href="#fist" width="60" height="80"/>
  </g>

  <!-- Fist 3 — lower right — points upper-left -->
  <g transform="translate(256,256) rotate(120) translate(-30,-155) scale(0.95)">
    <use href="#fist" width="60" height="80"/>
  </g>

  <!-- Fist 4 — BOTTOM — points up -->
  <g transform="translate(256,256) rotate(180) translate(-30,-155) scale(0.95)">
    <use href="#fist" width="60" height="80"/>
  </g>

  <!-- Fist 5 — lower left — points upper-right -->
  <g transform="translate(256,256) rotate(240) translate(-30,-155) scale(0.95)">
    <use href="#fist" width="60" height="80"/>
  </g>

  <!-- Fist 6 — upper left — points lower-right -->
  <g transform="translate(256,256) rotate(300) translate(-30,-155) scale(0.95)">
    <use href="#fist" width="60" height="80"/>
  </g>

  <!-- ═══ CENTER COIN ═══ -->
  <circle cx="256" cy="256" r="82" fill="#0d0600" stroke="#f59e0b" stroke-width="5"/>
  <circle cx="256" cy="256" r="72" fill="#0a0400" stroke="#78350f" stroke-width="2"/>

  <!-- Inner coin glow ring -->
  <circle cx="256" cy="256" r="65" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.25"/>

  <!-- HOOD text -->
  <text x="256" y="246" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900"
        font-size="36" fill="#3d1a00" dx="2" dy="2">HOOD</text>
  <text x="256" y="246" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900"
        font-size="36" fill="#f59e0b">HOOD</text>

  <!-- 60628 below -->
  <text x="256" y="274" text-anchor="middle" font-family="Arial" font-weight="800"
        font-size="15" fill="#92400e" letter-spacing="2">60628</text>

  <!-- BASE dot -->
  <circle cx="256" cy="292" r="4" fill="#f59e0b" opacity="0.6"/>

  </g>

  <!-- Arc text — top: NEIGHBORHOOD BLOCKCHAIN HUB -->
  <path id="topArc" d="M 68,256 A 188,188 0 0,1 444,256" fill="none"/>
  <text font-family="Arial" font-weight="800" font-size="17" fill="#92400e" letter-spacing="3">
    <textPath href="#topArc" startOffset="7%">NEIGHBORHOOD · BLOCKCHAIN · HUB</textPath>
  </text>

  <!-- Arc text — bottom: BASE NETWORK COMMUNITY OWNED -->
  <path id="botArc" d="M 68,256 A 188,188 0 0,0 444,256" fill="none"/>
  <text font-family="Arial" font-weight="800" font-size="17" fill="#92400e" letter-spacing="3">
    <textPath href="#botArc" startOffset="10%">BASE NETWORK · COMMUNITY OWNED</textPath>
  </text>

  <!-- Shine overlay -->
  <radialGradient id="shine" cx="35%" cy="28%" r="50%">
    <stop offset="0%" stop-color="white" stop-opacity="0.07"/>
    <stop offset="100%" stop-color="white" stop-opacity="0"/>
  </radialGradient>
  <circle cx="256" cy="256" r="256" fill="url(#shine)"/>
</svg>