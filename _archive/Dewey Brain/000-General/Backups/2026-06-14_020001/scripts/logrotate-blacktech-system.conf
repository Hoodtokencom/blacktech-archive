# Blacktech Solutions — Log Rotation Config
# Place at /etc/logrotate.d/blacktech (needs sudo)

# ── Application logs ──
/home/allenai/data/*.log {
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    create 0644 allenai allenai
    dateext
    dateformat -%Y%m%d
    postrotate
        # Signal any running Python services to reopen log handles if needed
        /bin/kill -HUP $(cat /tmp/pipeline.pid 2>/dev/null) 2>/dev/null || true
    endscript
}

/tmp/pipeline_output_*.txt {
    su allenai allenai
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 allenai allenai
}

# ── System logs (Pi specific) ──
/var/log/syslog
/var/log/messages
/var/log/kern.log
/var/log/auth.log {
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root adm
    sharedscripts
    postrotate
        /bin/kill -HUP $(cat /run/rsyslogd.pid 2>/dev/null) 2>/dev/null || true
    endscript
}

/var/log/daemon.log {
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root adm
}

/var/log/nginx/*.log {
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    create 0640 www-data adm
    postrotate
        if [ -f /var/run/nginx.pid ]; then
            kill -USR1 $(cat /var/run/nginx.pid)
        fi
    endscript
}

# ── Pi SD card protection ──
# Keep /var/log small to prevent SD card death
/var/log/*.log {
    weekly
    rotate 2
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root adm
}
