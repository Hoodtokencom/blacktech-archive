<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post 2 - 8 Courses, 75+ Lessons, 50+ Workflows</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #002244;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .post {
    width: 1080px;
    height: 1080px;
    background: #002244;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 80px 90px;
  }

  /* Decorative gradient */
  .post::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      radial-gradient(circle at 30% 40%, rgba(105, 190, 40, 0.08) 0%, transparent 50%),
      radial-gradient(circle at 70% 70%, rgba(165, 172, 175, 0.04) 0%, transparent 40%);
    pointer-events: none;
  }

  /* Green top bar */
  .post::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 8px;
    background: #69BE28;
  }

  .top-label {
    color: #69BE28;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 40px;
    margin-bottom: 20px;
    z-index: 2;
  }

  .main-headline {
    color: #ffffff;
    font-size: 56px;
    font-weight: 800;
    text-align: center;
    margin-bottom: 60px;
    z-index: 2;
    letter-spacing: -1px;
    line-height: 1.2;
  }

  .stats-grid {
    display: flex;
    flex-direction: column;
    gap: 35px;
    z-index: 2;
    width: 100%;
    max-width: 880px;
  }

  .stat-row {
    display: flex;
    align-items: center;
    gap: 40px;
    padding: 28px 45px;
    background: rgba(105, 190, 40, 0.08);
    border-left: 6px solid #69BE28;
    border-radius: 0 16px 16px 0;
  }

  .stat-number {
    color: #69BE28;
    font-size: 88px;
    font-weight: 900;
    line-height: 1;
    min-width: 180px;
    letter-spacing: -3px;
  }

  .stat-label {
    color: #ffffff;
    font-size: 32px;
    font-weight: 600;
    line-height: 1.3;
  }

  .stat-sub {
    color: #A5ACAF;
    font-size: 20px;
    font-weight: 400;
    margin-top: 6px;
  }

  .tagline {
    position: absolute;
    bottom: 55px;
    left: 0; right: 0;
    text-align: center;
    color: #A5ACAF;
    font-size: 24px;
    font-weight: 400;
    font-style: italic;
    z-index: 2;
    padding: 0 80px;
  }

  .tagline strong {
    color: #69BE28;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="post">
  <div class="top-label">The Numbers</div>
  <div class="main-headline">Built from scratch.<br>Trained on real problems.</div>

  <div class="stats-grid">
    <div class="stat-row">
      <div class="stat-number">8</div>
      <div>
        <div class="stat-label">Courses</div>
        <div class="stat-sub">Complete AI/ML curriculum</div>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-number">75+</div>
      <div>
        <div class="stat-label">Lessons</div>
        <div class="stat-sub">Hands-on, project-based</div>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-number">50+</div>
      <div>
        <div class="stat-label">Workflows</div>
        <div class="stat-sub">Production automation pipelines</div>
      </div>
    </div>
  </div>

  <div class="tagline">
    I built this for myself — <strong>here's what I can build for you.</strong>
  </div>
</div>
</body>
</html>
